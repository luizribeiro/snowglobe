---
name: Release

# A v* tag publishes a release with notes from CHANGELOG.md; people install
# snow from the flake. Running it by hand checks the notes without publishing.
"on":
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the tag is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Check CI passed on the tagged commit
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          runs=$(gh run list --commit "$GITHUB_SHA" --workflow CI \
            --status success --limit 1 --json databaseId --jq length)
          if [ "$runs" -eq 0 ]; then
            echo "::error::CI hasn't passed on $GITHUB_SHA yet"
            exit 1
          fi
      - id: version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          crate="v$(sed -n 's/^version = "\(.*\)"/\1/p' snow/Cargo.toml | head -n1)"
          if [ -n "$TAG" ] && [ "$TAG" != "$crate" ]; then
            echo "::error::Tag $TAG doesn't match snow/Cargo.toml ($crate)"
            exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"
      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v heading="## [${VERSION#v}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^(## \[|\[[^]]+\]: )/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for ${VERSION#v}"
            exit 1
          fi
          cat release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  publish:
    needs: prepare
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" --verify-tag "${prerelease[@]}" \
            --title "snowglobe $TAG" --notes-file release-notes.md
