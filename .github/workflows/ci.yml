name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same workflow + branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build dev shell
        run: nix develop --command echo "dev shell ready"

      - name: Check formatting
        run: nix develop --command cargo fmt --check

      - name: Run clippy
        run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: nix develop --command cargo test --workspace --verbose

      - name: Build debug
        run: nix develop --command cargo build --workspace --verbose

      - name: Build release
        run: nix develop --command cargo build --workspace --release --verbose

      - name: Build documentation
        run: nix develop --command cargo doc --workspace --no-deps

      - name: Run security audit
        run: nix develop --command cargo audit

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: snow-binary
          path: target/release/snow
          retention-days: 7
