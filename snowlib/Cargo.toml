[package]
name = "snowlib"
version = "0.1.0"
edition = "2021"

[dependencies]
miette = { version = "7.4", features = ["fancy"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
shellexpand = "3.1.1"
rand = "0.8"
tracing = "0.1"
parking_lot = "0.12.5"

[dev-dependencies]
tempfile = "3.8"
