[package]
name = "snowlib"
version = "0.1.0"
edition = "2021"
description = "Deployment logic behind snow, the snowglobe CLI"
publish = false
license.workspace = true
repository.workspace = true

[features]
# Mock backends and fixtures for other crates' tests; debug builds always have them
test-utils = []

[dependencies]
miette = { version = "7.4", features = ["fancy"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellexpand = "3.1.1"
rand = "0.8"
tracing = "0.1"
parking_lot = "0.12.5"
shell-escape = "0.1.5"
nix = { version = "0.29", features = ["signal", "user"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "time", "macros", "sync"] }
futures = "0.3"
async-trait = "0.1"
tempfile = "3.8"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
