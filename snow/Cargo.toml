[package]
name = "snow"
version = "0.1.0"
edition = "2021"
description = "Deploy NixOS and nix-darwin hosts over SSH, in phases"
publish = false
license.workspace = true
repository.workspace = true

[dependencies]
snowlib = { path = "../snowlib" }
clap = { version = "4.5", features = ["derive", "env"] }
miette = { version = "7.4", features = ["fancy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tabled = "0.16"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-indicatif = "0.3"
indicatif = "0.18"
parking_lot = "0.12.5"
console = "0.15"
dialoguer = "0.11"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal"] }
tempfile = "3.8"

[dev-dependencies]
snowlib = { path = "../snowlib", features = ["test-utils"] }
assert_cmd = "2.0"
predicates = "3.1"
nix = { version = "0.29", features = ["signal", "term"] }
