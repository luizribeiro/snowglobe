[package]
name = "snow"
version = "0.1.0"
edition = "2021"

[dependencies]
snowlib = { path = "../snowlib" }
clap = { version = "4.5", features = ["derive", "env"] }
miette = { version = "7.4", features = ["fancy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tabled = "0.16"

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.1"
